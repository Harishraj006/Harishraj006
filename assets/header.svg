<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="800" height="200" rx="16" fill="url(#bgGrad)" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect width="800" height="200" rx="16" fill="url(#grid)" />

  <circle cx="700" cy="40" r="80" fill="#EF4444" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="160" r="70" fill="#DC2626" fill-opacity="0.06" filter="url(#glow)"/>

  <!-- Top badge -->
  <g transform="translate(40, 32)">
    <rect width="170" height="26" rx="13" fill="#EF4444" fill-opacity="0.12" stroke="#EF4444" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="13" r="4" fill="#EF4444"/>
    <text x="26" y="17" fill="#F87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">PORTFOLIO &amp; LAB</text>
  </g>

  <!-- Name -->
  <text x="40" y="100" fill="#FFFFFF" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5">
    HARISHRAJ <tspan fill="url(#redAccent)">V</tspan>
  </text>

  <!-- Subtitle -->
  <text x="40" y="132" fill="#E5E7EB" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.3">
    Computer Science Engineer &bull; AI/ML &bull; Full-Stack Web &bull; Flutter &bull; Cybersecurity
  </text>

  <!-- Tertiary Info -->
  <text x="40" y="162" fill="#9CA3AF" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
    📍 Kongu Engineering College &bull; Erode, India &bull; Turning Ideas into Scalable Products 🚀
  </text>
</svg>
