<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="200" rx="16" fill="url(#bgGrad)" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="40" r="70" fill="#EF4444" fill-opacity="0.08"/>
  <circle cx="100" cy="160" r="60" fill="#DC2626" fill-opacity="0.06"/>
  <circle cx="740" cy="150" r="30" fill="#EF4444" fill-opacity="0.05"/>

  <!-- Top badge -->
  <g transform="translate(40, 30)">
    <rect width="180" height="26" rx="13" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="13" r="4" fill="#EF4444"/>
    <text x="28" y="17" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PORTFOLIO &amp; LAB</text>
  </g>

  <!-- Name -->
  <text x="40" y="100" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5">
    HARISHRAJ <tspan fill="url(#redAccent)">V</tspan>
  </text>

  <!-- Subtitle -->
  <text x="40" y="132" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500">
    Computer Science Engineer &#8226; AI/ML &#8226; Full-Stack Web &#8226; Flutter &#8226; Cybersecurity
  </text>

  <!-- Tertiary Info -->
  <text x="40" y="162" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
    Kongu Engineering College &#8226; Erode, India &#8226; Turning Ideas into Scalable Products
  </text>
</svg>
