<svg width="720" height="120" viewBox="0 0 720 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e0e" />
      <stop offset="50%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0e0e0e" />
    </linearGradient>
    <linearGradient id="quoteRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>

  <rect width="720" height="120" rx="14" fill="url(#quoteBg)" stroke="#EF4444" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Red side accent -->
  <rect x="0" y="0" width="6" height="120" rx="3" fill="url(#quoteRed)"/>

  <!-- Large decorative quote marks -->
  <text x="35" y="55" fill="#EF4444" fill-opacity="0.25" font-family="Georgia, serif" font-size="60" font-weight="700">“</text>

  <!-- Quote text -->
  <text x="70" y="52" fill="#F3F4F6" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-style="italic" font-weight="500">
    "I love converting ideas into useful products, learning by building,
  </text>
  <text x="70" y="78" fill="#F3F4F6" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-style="italic" font-weight="500">
    and improving every project with better code, design, and impact."
  </text>

  <text x="70" y="102" fill="#EF4444" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
    — HARISHRAJ V
  </text>
</svg>
